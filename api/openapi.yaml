openapi: "3.1.0"
info:
  title: qimeng-media API
  version: "0.1.0"
  description: |
    绮梦影库 NAS 多端版服务端协议（协议宪法）。
    本文件是三端（Go 服务端 / TS Web / Kotlin Android）SDK 的唯一生成源。
    规则：
    1. 先改本文件 → make sdk 重新生成 → 按编译错误适配代码。禁止手写客户端。
    2. 所有路径带 /api/v1 版本前缀；破坏性变更必须升版本或加兼容字段。
    3. 分页统一 cursor 式；错误统一 Error 结构。
    4. 领域语义（推荐/统计/匹配）见 docs/DOMAIN_RULES.md，本文件只定义传输结构。
servers:
  - url: "{scheme}://{host}:{port}"
    variables:
      scheme: { default: http, enum: [http, https] }
      host:   { default: nas.local }
      port:   { default: "8420" }

security:
  - bearerAuth: []

paths:
  # ---------- 认证 ----------
  /api/v1/auth/setup:
    post:
      summary: 首次初始化（设置管理密码，返回一次性显示的 token）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthSetupRequest" }
      responses:
        "201": { description: 创建成功，返回 token（仅此一次明文显示）, content: { application/json: { schema: { $ref: "#/components/schemas/AuthToken" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/verify:
    post:
      summary: 校验 token 有效性
      responses:
        "204": { description: 有效 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/login:
    post:
      summary: 密码登录（换发 token；换设备/清浏览器缓存后找回访问权）
      description: |
        用管理密码换取新 token——解决「token 仅 setup 明文一次」在换浏览器、
        清缓存、新设备场景下的死锁。单用户单 token 模型：登录成功即重铸
        token，旧 token 随之失效（旧浏览器需重新登录）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthSetupRequest" }
      responses:
        "200": { description: 登录成功，返回新 token, content: { application/json: { schema: { $ref: "#/components/schemas/AuthToken" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- 认证（开发专用，勿用于生产） ----------
  /api/v1/auth/dev-login:
    post:
      summary: 开发模式免密登录（仅 auth_dev_mode 开启时可用）
      description: |
        仅服务端 config/auth_dev_mode=true 时启用：免密码直接签发 token
        （与 /auth/login 同语义：签发即重铸，旧 token 随之失效；未初始化时
        自动创建 admin 占位用户）。未开启时一律 404——生产环境该端点不存在
        于语义层面，前端据此回退正常 setup/login 表单，行为零变化。
        仅限本机开发调试（用户约定：项目未完成前免密码直奔 UI），
        禁止配合公网/隧道使用（SECURITY.md 红线 5 单点例外说明）。
      security: []
      responses:
        "200": { description: 签发成功，返回新 token, content: { application/json: { schema: { $ref: "#/components/schemas/AuthToken" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- 库（媒体目录） ----------
  /api/v1/libraries:
    get:
      summary: 库列表（含文件计数与扫描状态）
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Library" } } } } }
    post:
      summary: 注册媒体目录（服务端本地路径，需存在）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryCreate" }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Library" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/libraries/{libraryId}:
    delete:
      summary: 删除库（低频管理操作，二次确认场景）
      description: |
        删除库登记。级联语义（外键 ON DELETE CASCADE）：该库全部 assets 及其关联
        （标签/作者关联、收藏、点赞、每日展示、每日统计物化）一并移除；
        view_events 事件流保留（历史统计，与单资产物理删除同语义，见 migrations/0001 注释）；
        磁盘媒体文件不动（文件删除只走回收站）；回收站内该库条目保留。
      parameters: [ { $ref: "#/components/parameters/LibraryId" } ]
      responses:
        "204": { description: 已删除 }
        "404": { description: 库不存在 }
  /api/v1/libraries/{libraryId}/scan:
    post:
      summary: 触发全量扫描（异步，进度走 SSE）
      parameters: [ { $ref: "#/components/parameters/LibraryId" } ]
      responses:
        "202": { description: 已触发 }
  /api/v1/libraries/{libraryId}/enabled:
    put:
      summary: 库启用/停用开关（停用仅隐藏浏览面，记录全保留，二次确认场景）
      description: |
        enabled=false：该库资产从浏览列表/搜索/推荐中隐藏，但 assets 及关联、
        view_events、统计物化、回收站、磁盘文件全部保留（migration 0007）；
        详情与签名直链不过滤（已获取的 assetId/链接保持稳定）。
        管理面（库列表）不受影响——文件管理页可看到并重新启用。
      parameters: [ { $ref: "#/components/parameters/LibraryId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: 已更新 }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events:
    get:
      summary: SSE 事件流（scan.progress / library.changed / thumbnail.progress / upload.done）
      description: |
        text/event-stream 流（WHATWG SSE 帧格式：event/data/id 行 + 空行）。
        首帧为 retry（重连等待毫秒）与 hello（data 为 {"version": string} JSON）。
        业务事件 data 为 JSON，载荷类型见 components/schemas：
        - scan.progress   → ScanProgressEvent
        - library.changed → LibraryChangedEvent
        - thumbnail.progress → 载荷契约待对应功能接线时补入本文件
        - upload.done → UploadDoneEvent
      responses:
        "200": { description: text/event-stream }
        "401": { description: 缺少/无效 Bearer token }

  # ---------- 资产浏览 ----------
  /api/v1/assets:
    get:
      summary: 资产列表（分页/筛选/排序/搜索，语义见 DOMAIN_RULES §3）
      description: 唯一列表口径。默认排除 COS 作者关联文件（DOMAIN_RULES §6，COS 有独立入口）。
      parameters:
        - { name: cursor,      in: query, schema: { type: string }, description: 分页游标 }
        - { name: limit,       in: query, schema: { type: integer, default: 60, maximum: 200 } }
        - { name: libraryId,   in: query, schema: { type: string } }
        - { name: sort,        in: query, schema: { type: string, enum: [default, fileDate, addedDate, viewCount, playCount, sizeBytes, name, favoriteAt], default: default }, description: 排序键（DOMAIN_RULES §3 八种；favoriteAt = 按收藏时间排序，仅 favorite=true 时语义成立） }
        - { name: order,       in: query, schema: { type: string, enum: [asc, desc], default: desc }, description: 顺位 }
        - { name: mediaType,   in: query, schema: { $ref: "#/components/schemas/MediaType" } }
        - { name: source,      in: query, schema: { type: array, items: { type: string } }, description: '出处分区多选（含 ''其他'' 桶=无出处常规文件）。多值语义：同维内 OR（命中数组内任一出处即入选）、与其余筛选维 AND；同名参数重复传或按生成器数组语法展开。单值 = 单元素数组，与旧单值协议向后兼容。数组含 ''其他'' 即并选 NULL source 的常规文件桶' }
        - { name: character,   in: query, schema: { type: array, items: { type: string } }, description: '角色多选。每个元素是一个角色表达式（''a+b'' 多角色 = 组合出镜，组内全部命中，DOMAIN_RULES §4 分隔符语义不变）；数组内多表达式 OR（命中任一组合即入选）、与其余筛选维 AND。单元素 = 旧单值协议向后兼容' }
        - { name: authorId,    in: query, schema: { type: string } }
        - { name: includeCos,  in: query, schema: { type: boolean, default: false }, description: 含 COS 作者关联文件（默认排除，COS 走独立入口） }
        - { name: cosOnly,     in: query, schema: { type: boolean, default: false }, description: 只要 COS 作者关联文件（分区胶囊「COS」语义；与 includeCos 互斥，两者同时为真时 cosOnly 优先） }
        - { name: work,        in: query, schema: { type: array, items: { type: string } }, description: 'COS 作品名多选（COS 库 `作者/作品/文件` 目录结构的第二段，旧版「COS 角色」维度口径，见 DOMAIN_RULES §6）。多值语义：数组内 OR、与其余筛选维 AND；单元素 = 旧单值协议向后兼容' }
        - { name: tagIds,      in: query, schema: { type: array, items: { type: string } } }
        - { name: tagMode,     in: query, schema: { type: string, enum: [fuzzy, exact], default: fuzzy } }
        - { name: viewRange,   in: query, schema: { $ref: "#/components/schemas/CountRange" } }
        - { name: playRange,   in: query, schema: { $ref: "#/components/schemas/CountRange" } }
        - { name: sizeRange,   in: query, schema: { $ref: "#/components/schemas/SizeRange" } }
        - { name: dateFrom,    in: query, schema: { type: string, format: date } }
        - { name: dateTo,      in: query, schema: { type: string, format: date } }
        - { name: yearFrom,    in: query, schema: { type: integer } }
        - { name: yearTo,      in: query, schema: { type: integer } }
        - { name: favorite,    in: query, schema: { type: boolean } }
        - { name: liked,       in: query, schema: { type: boolean }, description: 仅赞过（likes 表存在任意日行）的资产；false = 从未赞过 }
        - { name: q,           in: query, schema: { type: string }, description: 全文搜索（空格分词；多词 AND；子串匹配文件名/文件夹路径/标签/作者/角色/出处任一维度；与全部筛选叠加） }
        - { name: directory,   in: query, schema: { type: string }, description: '库内相对目录精确匹配（路径规范化后等值比较），只返回该目录的直接子文件、不含递归子目录；空串=库根（与 GET /dirs 的 DirTree 根节点 path="" 语义对齐）；缺省=不过滤。文件管理页目录树「文件行」数据源；非法路径（绝对路径/盘符/../逃逸/保留设备名等）返回 400 INVALID_PARAM；`a/..` 这类规范化后收敛为库根的相对路径同样拒绝（400）' }
        - { name: groupByDate, in: query, schema: { type: boolean, default: true }, description: 按日期分组返回（DOMAIN_RULES §8 标签规则） }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AssetPage" } } } }
  /api/v1/assets/facets:
    get:
      summary: 相册四维筛选候选（分区/作者/角色/类型）及其文件计数
      description: |
        供相册页四条胶囊栏渲染，语义对齐旧版手机端「全部」页四栏
        （LEGACY_REQUIREMENTS + 用户 2026-09-03 拍板）：

        - 分区栏：固定 all/regular/cos 三项（DOMAIN_RULES §6 隔离口径）；
        - **作者栏（旧版「作品」栏语义）**：候选 = 常规出处分组 + COS 作者，
          两集合按分区合并——常规分区只有出处分组（含「其他」=未匹配出处
          的常规文件），COS 分区只有 COS 作者，全部分区两者合并。
          常规 TXT 作者不进本栏（旧版口径：出处+cos_ 作者，双桶 kind 区分）；
        - **角色栏**：常规分区=匹配引擎角色名，COS 分区=COS 作品名
          （`作者/作品/文件` 第二段），全部分区=两者合并（kind 区分）；
        - 类型栏：固定 all/image/animated_image/video 四项
          （key=MediaType 枚举值，可直接回传 GET /assets 的 mediaType）。

        计数口径 = 排自身（faceted search 惯例）：计算某一维候选的 fileCount 时，
        忽略该维自身已选值，其余维度的当前选择全部生效。排自身的实现口径 =
        前端每维独立请求、请求时省略该维自身参数（服务端把 source/authorId
        对全部维照常作为收窄条件，2026-09-09 协议批起作者行亦然——修复作者
        集合页「固定 authorId 下作品维候选不收窄」缺陷）；角色栏的 character
        与 work 同属「角色」维（本端点无这两个参数之外的排自身分支）。空值
        候选（无作品目录的 COS 文件）不列入，前端按需兜底「其他」。

        favorite / history 是子集约束而非四维之一：传入时对全部四维（含
        分区栏）统一收窄统计口径（如 favorite=1 的分区芯片 = 收藏子集内的
        all/regular/cos），四维之间仍按排自身口径互算；二者自身不作为维度
        参与排除，无排自身问题。
      parameters:
        - { name: partition, in: query, schema: { $ref: "#/components/schemas/Partition" }, description: 当前分区（计算其他三维计数时生效；分区栏自身计数始终按排自身口径给出全量三分区计数） }
        - { name: mediaType, in: query, schema: { $ref: "#/components/schemas/MediaType" } }
        - { name: source,    in: query, schema: { type: string }, description: 当前出处/作品（作者栏的 source 类候选；'其他'=无出处常规文件，口径同 GET /assets） }
        - { name: character, in: query, schema: { type: string }, description: 当前角色（'a+b' 多角色） }
        - { name: authorId,  in: query, schema: { type: string }, description: 当前作者 }
        - { name: work,      in: query, schema: { type: string }, description: 当前 COS 作品（与 character 同属角色维，COS 分区下二者等价；同时传入取交集） }
        - { name: q,         in: query, schema: { type: string }, description: 全文搜索（口径同 GET /assets 的 q） }
        - { name: favorite,  in: query, schema: { type: boolean }, description: 收藏子集：只统计收藏资产（与 GET /assets favorite=true 同义）；缺省不约束 }
        - { name: history,   in: query, schema: { type: boolean }, description: 浏览历史子集：只统计存在 kind='open' 浏览事件的资产；缺省不约束 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AssetFacets" } } } }
  /api/v1/history:
    get:
      summary: 观看历史（每资产最近一次 open 事件时间倒序，每资产一条）
      description: |
        历史 = 浏览过的资产按其最近一次 kind='open' 的 ViewEvent 时间倒序；
        已删资产（view_events 无外键，ADR-0005）经 INNER JOIN assets 排除。
        COS 分区缺省全部 = 常规∪COS 合并（2026-09-05 用户拍板，原「与
        /assets 同口径默认排除」废止）：显式 includeCos=false 切常规分区
        （排除 COS 作者关联文件），cosOnly=true 切 COS 分区，与 /assets
        同一套三态开关（DOMAIN_RULES §6）。其余筛选（mediaType/source/
        work/character/authorId）与 GET /assets 同名参数同语义，在历史
        子集内叠加生效（source/character/work 为多选数组：同维内 OR、
        跨维 AND，单元素向后兼容）。
        分页为 keyset 游标（最近浏览时间 + asset_id）。
      parameters:
        - { name: cursor,     in: query, schema: { type: string }, description: 分页游标 }
        - { name: limit,      in: query, schema: { type: integer, default: 60, maximum: 200 } }
        - { name: includeCos, in: query, schema: { type: boolean, default: true }, description: 缺省全部（常规∪COS 合并，2026-09-05 用户拍板）；显式 false 切常规分区（排除 COS），cosOnly=true 切 COS 分区 }
        - { name: cosOnly,    in: query, schema: { type: boolean, default: false }, description: 只要 COS 作者关联文件（COS 分区；与 includeCos 同真时 cosOnly 优先） }
        - { name: work,       in: query, schema: { type: array, items: { type: string } }, description: 'COS 作品名多选（`作者/作品/文件` 目录结构第二段，语义同 GET /assets 的 work）。多值语义：数组内 OR、与其余筛选维 AND；单元素 = 旧单值协议向后兼容' }
        - { name: character,  in: query, schema: { type: array, items: { type: string } }, description: '角色多选（语义同 GET /assets 的 character：每元素 ''a+b'' 组合出镜组内 AND，数组内 OR；单元素向后兼容）' }
        - { name: source,     in: query, schema: { type: array, items: { type: string } }, description: '出处分区多选（语义同 GET /assets 的 source：数组内 OR、与其余筛选维 AND；''其他''=无出处常规文件桶；单元素向后兼容）' }
        - { name: authorId,   in: query, schema: { type: string }, description: 作者（按资产作者关联过滤；语义同 GET /assets 的 authorId） }
        - { name: mediaType,  in: query, schema: { $ref: "#/components/schemas/MediaType" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryPage" } } } }
  /api/v1/search/suggestions:
    get:
      summary: 搜索框输入补全（五维候选，子串命中）
      description: |
        搜索框输入补全（LEGACY_REQUIREMENTS §C + 用户 2026-09-05 拍板 3B）。
        五个候选维度 = 出处 / 角色 / COS 作者 / COS 作品 / 常规作者；q 对候选
        名做子串匹配（contains 语义，ASCII 大小写不敏感，DOMAIN_RULES §3
        匹配口径）。五维合并去重后按名称长度升序、再名称字典序返回（短名
        优先，贴近补全直觉）；同维同名去重为一条，跨维同名各保留一条
        （type 字段即区分语义，前端渲染类型徽标）。作者维只返回实际有关联
        文件的作者（LEGACY §C：零关联作者行对补全无意义；回收站删除即移出
        assets 表，作者随之失去候选资格）；COS 作品维的 NULL 作品（无作品
        子目录）不产生候选。q 为空（trim 后）且未开 recommend 时返回空列表；
        recommend=true 且 q 为空时返回随机抽取的五维候选合并共 limit 条
        （空态「推荐搜索」数据源，LEGACY 随机语义：每次请求随机、五维混合）。
      parameters:
        - { name: q,     in: query, required: true, schema: { type: string }, description: 补全关键词（子串匹配、大小写不敏感；空串返回空列表；recommend=true 时空串切换为随机推荐模式） }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 }, description: 返回条数上限 }
        - { name: recommend, in: query, schema: { type: boolean, default: false }, description: "推荐搜索词模式：true 且 q 为空（trim 后）时返回随机抽取的五维候选合并共 limit 条（type 照常；同维同名一条、跨维同名各保留）；q 非空时忽略本参数，照常子串匹配" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SearchSuggestions" } } } }
  /api/v1/assets/{assetId}:
    get:
      summary: 资产详情（含元数据/标签/作者/统计/时间轴标签/签名直链）
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AssetDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 删除（一律进回收站，非物理删除）
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      responses:
        "200": { description: 已移入回收站 }
  /api/v1/sources:
    get:
      summary: 出处列表（按规范名分组的文件计数；相册按出处分组用）
      description: |
        按出处（source 规范名）分组统计文件数，按 fileCount 降序；name 为 null
        表示无出处文件（前端兜底显示"其他"）。口径与 GET /assets 一致：
        默认排除 COS 作者关联文件（DOMAIN_RULES §3/§6），includeCos=true 重新包含。
      parameters:
        - { name: includeCos, in: query, schema: { type: boolean, default: false }, description: 含 COS 作者关联文件（默认排除，COS 走独立入口） }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SourceCount" } } } } }
  /api/v1/sources/custom:
    get:
      summary: 读取用户自定义出处名单（匹配引擎增量，DOMAIN_RULES §4）
      description: |
        返回当前生效的用户自定义出处名列表。无记录 = 空数组（内置检索表仍完整可用；
        这与匹配引擎的"无自定义出处"等价，不是缺少配置）。
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CustomSources" } } } }
    put:
      summary: 整体替换用户自定义出处名单
      description: |
        整体替换语义（与匹配引擎 UpdateCustomSources 对齐）：提交的列表就是生效
        名单，重复项/空项在服务端去重后按名称升序持久化；空数组 = 清空全部用户
        自定义出处。成功后运行中的匹配引擎立即生效，并由服务端异步对全部常规库
        资产重算出处/角色（已入库资产随全量扫描不会被重 ingest，必须显式重算）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomSources" }
      responses:
        "204": { description: 已保存并触发存量重算 }

  # ---------- 媒体文件服务（签名直链） ----------
  /media/orig/{assetId}:
    get:
      summary: 原图/原视频直链（HTTP Range 支持；签名参数校验；永不转码）
      security: []
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { name: exp, in: query, required: true, schema: { type: integer }, description: 过期时间戳 }
        - { name: sig, in: query, required: true, schema: { type: string }, description: HMAC 签名 }
      responses:
        "200": { description: 文件内容（Content-Type 按实际类型） }
        "206": { description: Range 分片 }
        "403": { description: 签名无效或过期 }
  /media/thumb/{assetId}:
    get:
      summary: 缩略图（生成策略见 DOMAIN_RULES §11；缓存 immutable，缓存键含 size）
      security: []
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { name: size, in: query, schema: { type: string, enum: [sm, md, lg], default: md }, description: 网格/列表/大图三档（缓存键组成部分）；像素档位单一来源 server/internal/thumbnail/cachekey.go 的 SizeSmall/SizeGrid/SizePreview 常量（md 档像素由 Thumbnail 配置 LongSide 决定，未配置回落 SizeGrid），改动双同步 }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: 缩略图字节（Content-Type 按实际格式：webp，ffmpeg 无 libwebp 编码器的部署降级 jpeg——内嵌形态；格式裁决单一来源 server/internal/thumbnail/stillformat.go，U11 批次D） }
        "403": { description: 签名无效或过期 }
        "404": { description: 资产不存在或缩略图不可用（生成失败给 404 占位语义） }

  # ---------- 上传与文件管理 ----------
  /api/v1/assets/upload:
    post:
      summary: 上传文件（流式；四道安全校验见 SECURITY.md；原样落盘永不转码）
      parameters:
        - { name: libraryId, in: query, required: true, schema: { type: string }, description: 目标库 ID（多库场景必须显式指定） }
        - { name: dir, in: query, required: true, schema: { type: string }, description: 目标目录（库内相对路径；空 = 库根） }
        - { name: filename, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { description: 上传成功并已入库, content: { application/json: { schema: { $ref: "#/components/schemas/AssetDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: 上传已关闭（PUT /config 的 upload.autoAccept=false）, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: 超过大小上限 }
  /api/v1/assets/{assetId}/move:
    post:
      summary: 移动/重命名（更新路径属性，关联数据无感保留）
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/dirs:
    get:
      summary: 目录树（文件整理用）
      parameters: [ { name: libraryId, in: query, required: true, schema: { type: string } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DirTree" } } } }
    post:
      summary: 新建目录
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [path, libraryId], properties: { path: { type: string }, libraryId: { type: string } } }
      responses:
        "201": { description: 已创建 }
  /api/v1/trash:
    get:
      summary: 回收站列表（含可恢复信息）
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TrashItem" } } } } }
    delete:
      summary: 清空回收站（物理删除全部；二次确认的显式管理操作）
      responses:
        "204": { description: 已清空 }
  /api/v1/trash/{trashId}/restore:
    post:
      summary: 从回收站恢复
      parameters: [ { $ref: "#/components/parameters/TrashId" } ]
      responses:
        "200": { description: 已恢复（冲突时自动重命名） }
  /api/v1/trash/{trashId}:
    delete:
      summary: 物理删除回收站内单个文件（二次确认场景）
      parameters: [ { $ref: "#/components/parameters/TrashId" } ]
      responses:
        "204": { description: 已物理删除 }

  # ---------- 行为上报 ----------
  /api/v1/events/view:
    post:
      summary: 上报浏览事件（ViewEvent 只追加；服务端负责会话级去重判断所需信息）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewEventReport" }
      responses:
        "202": { description: 已接受 }
  /api/v1/assets/{assetId}/like:
    put:
      summary: 点赞（toggle：当日已赞则本请求为取消今日赞；每资产每日一次，服务端判定）
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LikeState" } } } }
  /api/v1/assets/{assetId}/favorite:
    put:
      summary: 设置/取消收藏
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [favorite], properties: { favorite: { type: boolean } } }
      responses:
        "204": { description: OK }
  /api/v1/assets/{assetId}/progress:
    put:
      summary: 上报播放进度（断点续播状态；只保留最新值，非事件流）
      description: |
        播放器心跳式上报（建议 10s 间隔，暂停/离开播放页时各补一次）。
        进度是"最新状态"而非统计事实：服务端只保留每资产最新位置
        （assets.last_position_seconds），不写入 ViewEvent 事件流、不参与
        playCount 口径（DOMAIN_RULES §5 播放计数走 POST /events/view 的
        play 事件，同会话当日去重）。
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressUpdate" }
      responses:
        "204": { description: 已记录 }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- 标签 / 作者 / 时间轴 ----------
  /api/v1/tags:
    get:
      summary: 标签列表（含每个标签的关联文件数）
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Tag" } } } } }
    post:
      summary: 新建标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Tag" } } } }
  /api/v1/tags/{tagId}:
    delete:
      summary: 删除标签（级联清理全部文件关联，DOMAIN_RULES §7；不动媒体文件本身）
      parameters: [ { name: tagId, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: 已删除并清理关联 }
  /api/v1/assets/{assetId}/tags:
    put:
      summary: 替换资产标签集合
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tagIds], properties: { tagIds: { type: array, items: { type: string } } } }
      responses:
        "204": { description: OK }
  /api/v1/assets/{assetId}/tags/{tag}:
    delete:
      summary: 逐条解除单个标签关联（DOMAIN_RULES §7）
      description: |
        只删除该资产上指定标签名的一条关联，其余关联的 created_at 一律不动
        （区别于 PUT /assets/{assetId}/tags 整体替换会刷新全部关联时间）。
        幂等语义：标签存在但该资产本就未挂载 → 204（无变更照常 204）；
        资产不存在或标签池中无此名标签 → 404（标签名拼错不静默吞掉）。
        {tag} 为 URL 编码后的标签名；含路径分隔符 / 的标签名不适用本端点
        （路径单段限制），此类标签的解除用 PUT 全量替换承载。
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { name: tag, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已解除（或本就未挂载，幂等） }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/authors:
    get:
      summary: 作者列表（常规与 COS 统一返回，type 区分；排序与筛选见 DOMAIN_RULES §6）
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Author" } } } } }
  /api/v1/authors/import-txt:
    post:
      summary: 导入作者 TXT（三种格式自动识别；统一重建语义）
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { filename: { type: string }, content: { type: string } } }
      responses:
        "200": { description: 导入结果统计, content: { application/json: { schema: { $ref: "#/components/schemas/TxtImportResult" } } } }
    get:
      summary: 已导入的 TXT 文件名列表（旧版数据管理「TXT导入作者」卡片）
      description: 片段存于 kv_settings（imported_txt_sources）；同 filename 重导入为覆盖更新。
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TxtImportedFile" } } } } }
    delete:
      summary: 移除一个已导入 TXT 片段并从剩余片段统一重建
      description: |
        旧版数据管理「TXT导入作者」删除语义：从 imported_txt_sources 移除该
        片段，随后以「全部已导入 TXT 统一重建」口径从剩余片段重算作者与关联
        （DOMAIN_RULES §6）。重建后零关联的常规作者保留（不级联删作者行）。
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: 已移除并重建 }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/authors/import-txt/rebuild:
    post:
      summary: 重放全部已导入 TXT 片段，重建常规作者-文件关联（幂等修复入口）
      description: |
        从 kv_settings（imported_txt_sources）载入全部已导入 TXT 片段，以
        「全部已导入 TXT 统一重建」口径（DOMAIN_RULES §6）重建常规作者与
        normal 资产的关联。幂等重放：不新增、不修改、不删除任何已存片段，
        仅删旧关联后按片段并集全量重插——库重建/关联意外丢失后的修复入口。
        authorsImported=片段合并后的作者数；filesMatched=本次重放匹配到的
        文件关联数。无已存片段时返回零值（两个计数均为 0）。
      responses:
        "200": { description: 重建结果统计, content: { application/json: { schema: { $ref: "#/components/schemas/TxtImportResult" } } } }
  /api/v1/authors/{authorId}/follow:
    put:
      summary: 设置/取消关注作者（DOMAIN_RULES §6/§7 关注语义）
      parameters: [ { name: authorId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [follow], properties: { follow: { type: boolean } } }
      responses:
        "204": { description: OK }
  /api/v1/assets/{assetId}/timeline-tags:
    get:
      summary: 视频时间轴标签列表
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimelineTag" } } } } }
    post:
      summary: 添加时间轴标签
      parameters: [ { $ref: "#/components/parameters/AssetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeMillis, name]
              properties:
                timeMillis: { type: integer, format: int64 }
                name: { type: string }
                color: { type: string, pattern: '^(#[0-9a-fA-F]{6})?$', description: 可选颜色（hex 6 位，如 "#d6336c"）；缺省/空串=不设置颜色 }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/TimelineTag" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/assets/{assetId}/timeline-tags/{tagId}:
    put:
      summary: 更新时间轴标签（改名/改色/改时间点）
      description: |
        全量替换语义：提交 timeMillis 与 name 必填（校验同 POST——name 非空、
        timeMillis 非负），color 可选——省略或空串 = 清除颜色。tagId 必须
        属于该资产（不存在或不属于 → 404）。返回更新后的完整对象。
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { name: tagId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeMillis, name]
              properties:
                timeMillis: { type: integer, format: int64 }
                name: { type: string }
                color: { type: string, pattern: '^(#[0-9a-fA-F]{6})?$', description: 可选颜色；缺省/空串 = 清除颜色 }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/TimelineTag" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 删除时间轴标签
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { name: tagId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }

  # ---------- 推荐 / 排行 / 统计 ----------
  /api/v1/recommendations:
    get:
      summary: 推荐流（10 维算法见 DOMAIN_RULES §1；seed 控制同分桶打散）
      parameters:
        - { name: seed,  in: query, schema: { type: integer, format: int64, default: 0 }, description: 0=稳定排序；>0=刷新打散 }
        - { name: limit, in: query, schema: { type: integer, default: 60, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 }, description: '与 limit 组合做翻页切片：返回按当下打分排序后的 [offset, offset+limit) 切片（越界为空数组）。推荐流每次请求按当下打分重排，同流连续翻页可能混入已见项——由客户端按 assetId 去重兜底' }
        - { name: mediaType, in: query, schema: { $ref: "#/components/schemas/MediaType" } }
        - { name: cosOnly, in: query, schema: { type: boolean, default: false }, description: 'COS 推荐模式（首页 cos tab，对齐旧版「COS 推荐模式」语义）：true=候选集限定 COS 关联资产，同一套十维打分/权重回收/每日惩罚照跑；false=常规流（缺省排除 COS，DOMAIN_RULES §6 隔离）' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AssetSummary" } } } } }
  /api/v1/rankings:
    get:
      summary: 排行榜（热度=view+play+like；周期过滤）
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [day, week, month, quarter, year, all], default: week } }
        - { name: limit,  in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 }, description: '与 limit 组合做翻页切片：返回热度降序的 [offset, offset+limit) 切片（越界为空数组）' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AssetSummary" } } } } }
  /api/v1/stats/overview:
    get:
      summary: 总览（文件数/类型分布/累计浏览/今日浏览/库容量/来源库存等）
      description: range 仅作用于 avgViewsPerFile 的窗口（缺省 all=全时段）；其余字段为固定口径（todayViews=今日、totalViews=累计），不受 range 影响。
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month, quarter, year, all, 7d, 90d], default: all }, description: avgViewsPerFile 的统计窗口（枚举与 /stats/trends 同款） }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StatsOverview" } } } }
  /api/v1/stats/trends:
    get:
      summary: 浏览趋势（分桶口径见 DOMAIN_RULES §5：动态周/月/季全量不丢弃）
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month, quarter, year, all, 7d, 90d], default: month } }
        - { name: mediaType, in: query, schema: { $ref: "#/components/schemas/MediaType" } }
        - { name: source, in: query, schema: { type: string, enum: [normal, cos] }, description: '来源桶过滤（口径同 §6 分区判定，不新造）：normal=仅不关联 COS 作者的资产、cos=仅关联 COS 作者的资产；缺省=不过滤（常规∪COS）' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TrendBucket" } } } } }
  /api/v1/stats/most-viewed:
    get:
      summary: 常看文件（窗口内浏览次数或停留时长倒序，DOMAIN_RULES §5）
      description: |
        metric=views（缺省）：按窗口内 kind='open' 事件次数倒序；
        metric=seconds：按窗口内 dwell 事件 seconds 累加倒序（无 dwell 事件
        的文件不参与 seconds 榜）。仅现存资产入榜（已删资产事件不计）。
        同分 tie-break = assetId 字典序升序（排序确定性）。
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month, quarter, year, all, 7d, 90d], default: month } }
        - { name: metric, in: query, schema: { type: string, enum: [views, seconds], default: views } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 }, description: 服务端钳制：缺省 20，>50 取 50，<1 取默认 20 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MostViewedItem" } } } } }
  /api/v1/stats/top-authors:
    get:
      summary: 常看作者（窗口内该作者关联资产被打开次数倒序，DOMAIN_RULES §5/§6）
      description: |
        窗口内该作者关联资产的 open 事件次数倒序；资产与作者多对多，一次
        open 对每个关联作者各计一次。COS 作者按其 COS 关联资产计（前缀
        隔离天然成立）。仅现存资产的事件计入。
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month, quarter, year, all, 7d, 90d], default: month } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 }, description: 服务端钳制：缺省 20，>50 取 50，<1 取默认 20 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TopAuthorItem" } } } } }
  /api/v1/stats/top-tags:
    get:
      summary: 常看标签（窗口内带该标签资产被打开次数倒序，DOMAIN_RULES §5/§7）
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month, quarter, year, all, 7d, 90d], default: month } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 }, description: 服务端钳制：缺省 20，>50 取 50，<1 取默认 20 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TopTagItem" } } } } }
  /api/v1/recommendations/prefs:
    get:
      summary: 读取推荐偏好（9 维权重）
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendPrefs" } } } }
    put:
      summary: 更新推荐偏好
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendPrefs" }
      responses:
        "204": { description: OK }

  # ---------- 客户端配置 / 异常上报 ----------
  /api/v1/config:
    get:
      summary: 读取客户端配置（设置页扫描/上传卡的持久化值）
      description: |
        无存储记录时返回缺省值：scan.workers=2、scan.thumbEdge=800、
        upload.maxBytesMb=2048、upload.autoAccept=true。
        生效范围（诚实口径）：upload.maxBytesMb 与 upload.autoAccept
        实时生效（上传端点每次请求时读取）；scan.workers / scan.thumbEdge
        为预留字段——暂未接入扫描器/缩略图管线，保存后暂不生效
        （接入管线前连重启也不生效，客户端 UI 不得宣传"重启后生效"）。
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClientConfig" } } } }
    put:
      summary: 全量替换客户端配置（校验通过后落库，返回存储后全量）
      description: |
        提交对象即生效配置（全量替换语义），须提交完整对象：scan 与 upload
        两组及其全部叶子键（workers/thumbEdge/maxBytesMb/autoAccept）缺任一
        → 400 INVALID_PARAM（防 bool 缺键被零值 false 静默关闸）。任一数值
        超出声明范围 → 400 INVALID_PARAM。成功后返回存储后全量
        （=提交值经校验后的形态）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientConfig" }
      responses:
        "200": { description: 已保存, content: { application/json: { schema: { $ref: "#/components/schemas/ClientConfig" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/client-logs:
    post:
      summary: 客户端异常批量上报（1~50 条/请求）
      description: |
        Web/Android 客户端把未捕获异常与告警批量上报，服务端环形缓冲只保留
        最新 200 条（超出丢最旧），供维护页「客户端异常」排查表读取。
        批量条数 1~50，超出 400；level 非法 400；单条 message 超 2000 字
        400（协议明确不截断——截断会静默破坏排障现场）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientLogBatch" }
      responses:
        "204": { description: 已记录 }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      summary: 已上报客户端异常列表（新→旧；环形缓冲最新 200 条）
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClientLogPage" } } } }

  # ---------- 系统 ----------
  /api/v1/healthz:
    get:
      summary: 存活探针（免鉴权）
      description: |
        免鉴权探活。服务端同时保留根路径 /healthz /readyz 作为运维探针别名
        （docker/k8s 惯例），不属于 API 协议面；两边行为一致（200 + 同 body）。
      security: []
      responses:
        "200": { description: alive }
  /api/v1/readyz:
    get:
      summary: 就绪探针（库可达/磁盘余量）
      description: |
        免鉴权探活。根路径 /healthz /readyz 是运维探针别名（docker/k8s 惯例），
        不属于 API 协议面；两边行为一致。
      security: []
      responses:
        "200": { description: ready }
        "503": { description: 未就绪 }
  /metrics:
    get:
      summary: Prometheus 指标（管理权限）
      responses:
        "200": { description: text/plain 指标输出 }
  /api/v1/system/status:
    get:
      summary: 系统面板数据（负载/流量/磁盘，OBSERVABILITY.md）
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SystemStatus" } } } }
  /api/v1/import/qimeng-backup:
    post:
      summary: 旧版数据迁移（qimeng_backup.json，映射见 DOMAIN_RULES §10，幂等）
      description: |
        按「文件名匹配」把旧备份的作者/标签/统计/时间轴导入新库：mediaStats/dailyBrowse/likes/favorites/history
        转换为 ViewEvent 回放（统计从事件重建）；幂等语义 = 同一 exportedAtMillis 批次只回放一次事件，
        作者/标签/关联按唯一键 upsert 天然幂等，重复导入不翻倍。
        scanSources/settings 段不导入（SAF 目录概念不存在，响应 warnings 提示重新配置库）；
        albumRules 段无对应能力，忽略。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyBackupImport" }
      responses:
        "200": { description: 迁移结果统计, content: { application/json: { schema: { $ref: "#/components/schemas/LegacyImportResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { description: 请求体超 64MB 上限（备份导入 per-route 放宽值）, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/export/qimeng-backup:
    get:
      summary: 导出旧版格式备份（qimeng_backup.json，DOMAIN_RULES §10 逆向映射）
      description: |
        把当前库导出为旧版「绮梦影库」单文件全量备份（DATA_MIGRATION_SPEC v1 格式），
        可回灌旧版 App 或经 POST /import/qimeng-backup 幂等回环到其他新实例。
        段级口径（与 §10 导入映射互为镜像）：settings/scanSources/albumRules/cosWorks
        导出为空数组（SAF 目录为设备本机概念、COS 作品目录与出处均为派生信息）；
        dailyBrowse 由事件流物化表（asset x day）导出；mediaStats 由事件流按资产聚合；
        history 截取最近 500 条 open 事件（对齐旧库 view_history 上限）；点赞按点赞行
        聚合为 { 累计次数, 最后点赞日 }；recommendationPrefs 从 kv_settings 原样导出。
        recordKey 生成镜像导入消歧规则：文件名唯一 = 文件名；同名 = 「文件名 @ 文件夹名」；
        同名同文件夹（跨库）再追加 #路径哈希。响应带 Content-Disposition: attachment。
      responses:
        "200":
          description: qimeng_backup.json 全量备份
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyBackupFile" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: "QM token" }

  parameters:
    LibraryId: { name: libraryId, in: path, required: true, schema: { type: string } }
    AssetId:   { name: assetId,   in: path, required: true, schema: { type: string, format: uuid } }
    TrashId:   { name: trashId,   in: path, required: true, schema: { type: string } }

  responses:
    BadRequest:  { description: 参数错误, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: 未认证,   content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound:    { description: 不存在,   content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict:    { description: 冲突,     content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, description: 机器可读错误码（PATH_ESCAPE/TOO_LARGE/INVALID_TYPE/...） }
        message: { type: string, description: 人类可读信息（不含内部路径） }

    AuthSetupRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }

    AuthToken:
      type: object
      properties:
        token: { type: string, description: 仅 setup 响应中明文返回一次 }

    MediaType:
      type: string
      enum: [image, animated_image, video]

    Partition:
      type: string
      enum: [all, regular, cos]
      description: |
        相册/筛选分区（DOMAIN_RULES §6 隔离口径）：
        regular = 排除 COS 作者关联文件（GET /assets 默认口径）；
        cos     = 只要 COS 作者关联文件；all = 两者都含。
        分区胶囊固定这三项，与 GET /assets 的 includeCos/cosOnly 布尔是同一
        语义的两种写法（facets/相册用枚举，底层筛选用布尔）。

    FacetBucket:
      type: object
      description: 相册胶囊栏的一条候选及其文件计数
      required: [key, name, fileCount]
      properties:
        key:       { type: string, description: 回传筛选值（分区/类型枚举值、authorId、角色名或 COS 作品名） }
        name:      { type: string, description: 显示名（作者/角色/作品为原名，分区/类型为中文标签） }
        fileCount: { type: integer, description: 该文件数在当前「其他维度」选择下统计（排自身口径） }
        kind:      { type: string, enum: [source, author, character, work], description: 该候选回传哪个筛选参数（source=GET /assets 的 source；author=authorId；character=character；work=work）。同一胶囊栏混合两种候选（作者栏=出处+COS 作者，全部分区角色栏=角色+作品）时前端按此分派 }

    AssetFacets:
      type: object
      description: GET /api/v1/assets/facets 响应：四维候选，每维计数均排除该维自身选择
      required: [partitions, authors, characters, types]
      properties:
        partitions: { type: array, items: { $ref: "#/components/schemas/FacetBucket" }, description: 固定 all/regular/cos 三项 }
        authors:    { type: array, items: { $ref: "#/components/schemas/FacetBucket" }, description: 作者栏候选（旧版「作品」栏语义）：常规出处分组（kind=source，含「其他」桶）+ COS 作者（kind=author）按分区合并，按 fileCount 降序。常规 TXT 作者不在此栏 }
        characters: { type: array, items: { $ref: "#/components/schemas/FacetBucket" }, description: 常规分区=角色名（kind=character）；COS 分区=COS 作品名（kind=work）；全部分区=两者合并。按 fileCount 降序 }
        types:      { type: array, items: { $ref: "#/components/schemas/FacetBucket" }, description: 固定 all/image/animated_image/video 四项（key=MediaType 枚举值，可直接回传 GET /assets 的 mediaType） }

    CountRange:
      type: string
      enum: [all, none, low, mid, high]
      description: none=0 次；low=1-5；mid=5-20；high=>20

    SizeRange:
      type: string
      enum: [all, lt1m, m1to10, m10to50, gt50m]

    Library:
      type: object
      properties:
        id:        { type: string }
        name:      { type: string }
        rootPath:  { type: string, description: 服务端本地路径（仅管理端展示） }
        fileCount: { type: integer }
        videoCount: { type: integer }
        imageCount: { type: integer }
        scanState: { type: string, enum: [idle, scanning, error] }
        enabled:   { type: boolean, default: true, description: 库启用开关（PUT 到本库的 enabled 子资源）——停用仅从浏览/搜索/推荐列表隐藏，资产记录/事件流/统计/磁盘文件全部保留（migration 0007，ADR-0012） }
        kind:      { type: string, enum: [normal, cos], default: normal, description: 库类型——normal 常规媒体库；cos COS 作者库（按 作者/作品/文件 目录结构扫描建 cos_ 作者，DOMAIN_RULES §6），COS 文件不进常规浏览流 }

    LibraryCreate:
      type: object
      required: [name, rootPath]
      properties:
        name:     { type: string }
        rootPath: { type: string, description: 服务端可访问的绝对路径 }
        kind:     { type: string, enum: [normal, cos], default: normal, description: 缺省 normal；COS 作者库传 cos }

    AssetSummary:
      type: object
      properties:
        id:          { type: string, format: uuid }
        fileName:    { type: string }
        mediaType:   { $ref: "#/components/schemas/MediaType" }
        sizeBytes:   { type: integer, format: int64 }
        modifiedAt:  { type: string, format: date-time }
        addedAt:     { type: string, format: date-time }
        source:      { type: string, description: 出处分区（匹配引擎产出） }
        characters:  { type: array, items: { type: string } }
        isFavorite:  { type: boolean }
        likeCount:   { type: integer }
        likedToday:  { type: boolean, description: '当日是否已点赞（本地日历日，每资产每日一次、次日重置——与 PUT /assets/{assetId}/like 的 LikeState.likedToday 同口径）。点赞按钮初始态；增量可选字段，由列表/详情端点填充，其余返回 AssetSummary 的端点可省略' }
        thumbUrl:    { type: string, description: 签名缩略图 URL }
        durationMs:  { type: integer, format: int64, description: 视频时长（图片/动图无值；仅 VIDEO 扫描时探测） }
        authorNames: { type: array, items: { type: string }, description: 该资产全部作者显示名（常规∪COS，DOMAIN_RULES §6）。列表类端点（GET /assets、GET /recommendations）返回，无作者为空数组；详情端点省略本字段（用 authors 完整对象） }
        cosWork:     { type: [string, "null"], description: 'COS 作品子目录名（assets.cos_work，rel_path 第二段，DOMAIN_RULES §6；仅 COS 库扫描赋值）。列表与详情端点（GET /assets、GET /assets/{assetId}）均返回；常规库资产与无作品子目录（作者/文件平铺）的 COS 资产为 null——客户端卡片标题优先取本字段、null 回退 fileName' }
        lastPositionSeconds: { type: [number, "null"], format: double, description: '断点续播位置（秒；未播过/图片=null）。播放器经 PUT /assets/{assetId}/progress 上报；已看完口径 = >= durationMs/1000，由客户端推导。format double 与 ProgressUpdate.positionSeconds 同根修口径（响应侧统一，无行为变化）' }
        viewCount:   { type: integer, description: 累计浏览次数（kind='open' 事件计数）。仅填充该字段的端点返回（排行榜等），列表端点可省略 }
        playCount:   { type: integer, description: 累计播放次数（kind='play' 事件计数）。填充约定同 viewCount }

    AssetPage:
      type: object
      properties:
        items:        { type: array, items: { $ref: "#/components/schemas/AssetSummary" } }
        nextCursor:   { type: [string, "null"] }
        totalMatched: { type: integer }

    HistoryPage:
      type: object
      properties:
        items:      { type: array, items: { $ref: "#/components/schemas/HistoryItem" } }
        nextCursor: { type: [string, "null"] }

    HistoryItem:
      allOf:
        - $ref: "#/components/schemas/AssetSummary"
        - type: object
          properties:
            lastViewedAt: { type: integer, format: int64, description: 该资产最近一次 kind='open' 事件的 started_at 时间戳（Unix 毫秒） }

    SearchSuggestions:
      type: object
      description: GET /api/v1/search/suggestions 响应：五维合并去重排序后的补全候选（q 为空且未开 recommend 时 items 为空数组；recommend=true 且 q 为空时为随机抽取的五维候选）
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SearchSuggestion" } }

    SearchSuggestion:
      type: object
      description: 一条补全候选
      required: [type, name]
      properties:
        type: { $ref: "#/components/schemas/SearchSuggestionType" }
        name: { type: string, description: 候选名（可回传搜索框继续检索；出处/角色/COS 作品对应 GET /assets 的 source/character/work，两类作者经作者端点定位） }

    SearchSuggestionType:
      type: string
      enum: [source, character, cosAuthor, cosWork, author]
      description: 候选维度：source=出处、character=角色、cosAuthor=COS 作者、cosWork=COS 作品（assets.cos_work）、author=常规作者（仅实际有关联文件者）

    SourceCount:
      type: object
      description: 出处分组的文件计数（GET /api/v1/sources 响应条目）
      properties:
        name:      { type: [string, "null"], description: 出处规范名；null = 无出处文件（前端兜底显示"其他"） }
        fileCount: { type: integer }

    CustomSources:
      type: object
      description: 用户自定义出处名单（GET/PUT /api/v1/sources/custom 载荷；持久化键 kv_settings.custom_sources）
      required: [names]
      properties:
        names: { type: array, items: { type: string }, description: 自定义出处名列表（整体替换；空数组 = 清空） }

    AssetDetail:
      allOf:
        - $ref: "#/components/schemas/AssetSummary"
        - type: object
          properties:
            libraryId:    { type: string, description: 所属库 ID（多库场景客户端定位整理目标用） }
            relPath:      { type: string }
            directory:    { type: string }
            videoCodec:   { type: [string, "null"], description: '视频编码（ffprobe codec_name，如 h264/hevc/av1；Web 端据此判断浏览器直链兼容性。探测失败/存量资产未重探=null）' }
            audioCodec:   { type: [string, "null"], description: '音频编码（如 aac/flac/opus；无音轨/未知=null）' }
            width:        { type: integer }
            height:       { type: integer }
            tags:         { type: array, items: { $ref: "#/components/schemas/Tag" } }
            authors:      { type: array, items: { $ref: "#/components/schemas/Author" } }
            viewCount:    { type: integer }
            playCount:    { type: integer }
            totalBrowseSeconds: { type: integer }
            lastViewedAt: { type: [string, "null"], format: date-time }
            origUrl:      { type: string, description: 签名原图/视频直链（查看永远发原件，无缩放副本） }

    MoveRequest:
      type: object
      required: [targetDir]
      properties:
        targetDir: { type: string, description: 库内目标目录（相对路径） }
        newName:   { type: string, description: 可选重命名 }

    TrashItem:
      type: object
      properties:
        id:          { type: string }
        fileName:    { type: string }
        originalPath: { type: string }
        deletedAt:   { type: string, format: date-time }
        sizeBytes:   { type: integer, format: int64 }
        expiresAt:   { type: string, format: date-time }

    DirTree:
      type: object
      properties:
        path:     { type: string }
        dirs:     { type: array, items: { $ref: "#/components/schemas/DirTree" } }
        fileCount: { type: integer }

    ViewEventReport:
      type: object
      required: [assetId, kind, startedAt, sessionId, clientEventId]
      properties:
        assetId:   { type: string, format: uuid }
        kind:      { type: string, enum: [open, play, dwell] }
        startedAt: { type: string, format: date-time }
        seconds:   { type: number, format: double, description: dwell 时的停留秒数（format double：客户端 SDK 走原生小数类型直接序列化为 JSON 数字——无 format 时 Kotlin 生成 BigDecimal 被序列化为带引号字符串导致服务端 400，协议批 2026-09-09 根修） }
        sessionId: { type: string, description: "客户端会话标识（App 启动/Web 标签页生成，UUID 即可）；open/play 按当日会话级去重（同 assetId+kind+sessionId+事件发生日已有同类事件则不重复计数），dwell 不去重——停留秒逐条累加、不减不重（DOMAIN_RULES §5）" }
        clientEventId:
          type: string
          format: uuid
          description: >-
            客户端幂等键（任务L L5「本地优先合并」口径）：客户端在事件产生时生成 UUID，
            随本地暂存（App Room 队列 / Web IndexedDB 账本）持久，重试/补传/导出再 POST
            一律携带**同一** clientEventId。服务端对它建唯一索引做写入幂等——同一
            clientEventId 重复提交返回 202 但**不重复入库、不重复计数**（dwell 秒数不重复
            累加、open/play 不重复计数），客户端据此可安全「发送成功（2xx）才删本地暂存」。
            服务端列可空：历史数据与不带此字段的旧格式请求按 NULL 放行照常入库（SQLite
            唯一索引允许多 NULL 互不冲突），幂等语义仅对携带 id 的事件生效。

    ProgressUpdate:
      type: object
      required: [positionSeconds]
      properties:
        positionSeconds: { type: number, format: double, minimum: 0, description: 当前播放位置（秒；视频实际进度而非停留时长，与 dwell.seconds 的停留语义区分；format double 同 ViewEventReport.seconds 根修口径——JSON 数字直传） }

    LikeState:
      type: object
      properties:
        likedToday: { type: boolean }
        likeCount:  { type: integer }

    Tag:
      type: object
      properties:
        id:        { type: string }
        name:      { type: string }
        fileCount: { type: integer }

    Author:
      type: object
      properties:
        id:        { type: string, description: 常规=generateAuthorId 规则；COS=cos_ 前缀 }
        displayName: { type: string }
        type:      { type: string, enum: [regular, cos] }
        fileCount: { type: integer }
        followed:  { type: boolean }
        viewCount: { type: integer, description: 该作者全部作品累计浏览次数（kind='open' 事件计数） }

    TimelineTag:
      type: object
      properties:
        id:        { type: string }
        timeMillis: { type: integer, format: int64 }
        name:      { type: string }
        color:     { type: string, pattern: '^(#[0-9a-fA-F]{6})?$', description: '十六进制颜色（如 "#d6336c"）；缺省/空 = 服务端未存储颜色，客户端自兜底。预设类型不入协议，客户端按 color 自持（2026-09-09 协议批 P2）' }

    TxtImportResult:
      type: object
      properties:
        authorsImported: { type: integer }
        filesMatched:    { type: integer }

    TxtImportedFile:
      type: object
      description: 已导入 TXT 片段（GET /api/v1/authors/import-txt 响应条目）
      required: [filename]
      properties:
        filename: { type: string, description: 片段名（空串=匿名导入的最近一份） }

    StatsOverview:
      type: object
      properties:
        totalFiles:  { type: integer }
        imageCount:  { type: integer }
        videoCount:  { type: integer }
        totalSizeBytes: { type: integer, format: int64 }
        todayViews:  { type: integer }
        totalViews:  { type: integer, format: int64 }
        sourceNormalCount: { type: integer, description: '常规来源库存：不关联 COS 作者的现存资产数（谓词同 §6 分区判定）' }
        sourceCosCount: { type: integer, description: 'COS 来源库存：关联 COS 作者的现存资产数' }
        avgViewsPerFile: { type: [number, "null"], format: double, description: '平均浏览次数 = 窗口内现存资产 open 事件总数 ÷ 窗口内至少一次 open 的不同现存文件数；窗口由本端点 range 参数决定（缺省 all=全时段）；分母 0 → null' }
        per_type_size_bytes: { $ref: "#/components/schemas/StatsSizeByType" }
        per_source_size_bytes: { $ref: "#/components/schemas/StatsSizeBySource" }

    StatsSizeByType:
      type: object
      description: '分类型大小：现存资产按 media_type 分组各求和 size_bytes（口径见 DOMAIN_RULES §5）；image 不含 animated_image，各键之和 = totalSizeBytes；无资产的类型 = 0'
      properties:
        image: { type: integer, format: int64, description: 图片资产 size_bytes 求和（不含动图） }
        video: { type: integer, format: int64, description: 视频资产 size_bytes 求和 }
        animated_image: { type: integer, format: int64, description: 动图资产 size_bytes 求和 }

    StatsSizeBySource:
      type: object
      description: '分来源大小：现存资产按来源分区各求和 size_bytes（谓词同 sourceNormalCount/sourceCosCount 的 §6 分区判定）；两键之和 = totalSizeBytes；无资产的来源 = 0'
      properties:
        normal: { type: integer, format: int64, description: 常规来源（不关联 COS 作者）size_bytes 求和 }
        cos: { type: integer, format: int64, description: COS 来源（关联 COS 作者）size_bytes 求和 }

    MostViewedItem:
      type: object
      required: [assetId, fileName, mediaType, value]
      properties:
        assetId:  { type: string, format: uuid }
        fileName: { type: string }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        thumbUrl: { type: string, description: 签名缩略图 URL（与 AssetSummary.thumbUrl 同一签名机制） }
        value:    { type: integer, description: metric=views 时 = 窗口内 open 事件次数；metric=seconds 时 = 窗口内 dwell 秒数累计 }

    TopAuthorItem:
      type: object
      required: [authorId, displayName, views]
      properties:
        authorId:    { type: string, description: 常规=generateAuthorId 规则；COS=cos_ 前缀 }
        displayName: { type: string }
        views:       { type: integer, description: 窗口内该作者关联资产的 open 事件次数 }

    TopTagItem:
      type: object
      required: [tag, views]
      properties:
        tag:   { type: string, description: 标签名（tags.name，全局唯一） }
        views: { type: integer, description: 窗口内带该标签资产的 open 事件次数 }

    TrendBucket:
      type: object
      properties:
        label:     { type: string, description: 周/月/季标签（口径见 DOMAIN_RULES §5） }
        start:     { type: string, format: date }
        end:       { type: string, format: date }
        viewCount: { type: integer }
        playCount: { type: integer }
        seconds:   { type: integer }

    # SSE 事件载荷（/api/v1/events 业务事件 data 帧 JSON）。
    # 字段与 server/internal/scanner/scanner.go 的事件构造结构体一一对应，
    # 改动必须双同步（协议先行：先改本文件再改代码，见 AI_README_FIRST.md）。
    ScanProgressEvent:
      type: object
      required: [libraryId, scanned, total, added, updated, phase]
      properties:
        libraryId: { type: string }
        scanned:   { type: integer }
        total:     { type: integer, description: 估算值（首扫 0 起步随 scanned 增长，复扫以库内记录数为基数） }
        added:     { type: integer }
        updated:   { type: integer }
        phase:     { type: string, enum: [walking, reconciling] }
    LibraryChangedEvent:
      type: object
      description: library.changed 事件 data 载荷。广播型触发帧（如扫描结束的 FinishScan 仅发刷新通知，见 server/internal/httpapi/libraries.go）不携带计数，此时 data 为 null；客户端须容忍 null。
      required: [libraryId, added, updated, moved, removed]
      properties:
        libraryId: { type: string }
        added:     { type: integer }
        updated:   { type: integer }
        moved:     { type: integer }
        removed:   { type: integer }
    UploadDoneEvent:
      type: object
      description: upload.done 事件 data 载荷。字段与 server/internal/events/events_events.go 的 UploadDoneEvent 结构体一一对应，改动必须双同步（协议先行：先改本文件再改代码）。
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid, description: 已入库资产 ID（下载 SDK 代码项目的 assetId） }

    RecommendPrefs:
      type: object
      description: 九维权重（全部 format double——同 ViewEventReport.seconds 根修口径，客户端 SDK 原生小数直传 JSON 数字）
      properties:
        tagRelevance: { type: number, format: double, default: 0.22 }
        tagCollection: { type: number, format: double, default: 0.15 }
        engagement:   { type: number, format: double, default: 0.10 }
        recency:      { type: number, format: double, default: 0.15 }
        likeScore:    { type: number, format: double, default: 0.05 }
        discovery:    { type: number, format: double, default: 0.20 }
        freshness:    { type: number, format: double, default: 0.05 }
        browseDepth:  { type: number, format: double, default: 0.03 }
        maxRandom:    { type: number, format: double, default: 0.30 }

    ClientConfig:
      type: object
      description: 客户端配置（GET/PUT /api/v1/config 载荷；持久化键 kv_settings.client_config）。PUT 为全量替换语义，须提交完整对象
      required: [scan, upload]
      properties:
        scan: { $ref: "#/components/schemas/ClientConfigScan" }
        upload: { $ref: "#/components/schemas/ClientConfigUpload" }

    ClientConfigScan:
      type: object
      description: 扫描管线参数（预留字段：暂未接入扫描器/缩略图管线，保存后暂不生效）
      required: [workers, thumbEdge]
      properties:
        workers:
          type: integer
          minimum: 1
          maximum: 4
          default: 2
          description: 扫描并发数（1–4，缺省 2，超出可能加重 NAS 负载）。预留字段：暂未接入扫描器管线，保存后暂不生效
        thumbEdge:
          type: integer
          minimum: 200
          maximum: 1600
          default: 800
          description: 缩略图长边像素（200–1600，缺省 800）。预留字段：暂未接入缩略图管线，保存后暂不生效

    ClientConfigUpload:
      type: object
      description: 上传行为约束（实时生效：上传端点每次请求时读取）
      required: [maxBytesMb, autoAccept]
      properties:
        maxBytesMb:
          type: integer
          minimum: 64
          maximum: 8192
          default: 2048
          description: 单文件上传上限（MB，64–8192，缺省 2048）。实时生效：与配置文件 upload.max_bytes 取小者（min），部署方配置文件收紧时以更严者为准
        autoAccept:
          type: boolean
          default: true
          description: 自动接收上传开关（缺省 true）。false 时上传端点 403 UPLOAD_DISABLED，实时生效

    ClientLogEntry:
      type: object
      description: 客户端异常上报条目（POST/GET /api/v1/client-logs；服务端环形缓冲最新 200 条，超出丢最旧）
      required: [ts, level, message]
      properties:
        ts:     { type: integer, format: int64, description: 事件发生时刻（Unix 毫秒，客户端时钟） }
        level:  { type: string, enum: [error, warn, info], description: 级别；非法值 400 }
        message: { type: string, maxLength: 2000, description: 消息文本（超 2000 字 400，不截断） }
        stack:  { type: string, description: 异常堆栈（可选；仅 error 级别通常携带） }
        page:   { type: string, description: 发生页面（Web 端为 location.pathname，可选） }

    ClientLogBatch:
      type: object
      description: POST /api/v1/client-logs 请求体（批量上报，1~50 条/请求）
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/ClientLogEntry" }

    ClientLogPage:
      type: object
      description: GET /api/v1/client-logs 响应（新→旧，环形缓冲最新 200 条）
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ClientLogEntry" } }

    SystemStatus:
      type: object
      properties:
        cpuPercent:    { type: number, format: double }
        perCore:       { type: array, items: { type: number, format: double }, description: 按逻辑核心的 CPU 使用率明细（0~100），首次采样前为全 0 }
        memUsedBytes:  { type: integer, format: int64 }
        memTotalBytes: { type: integer, format: int64 }
        disks:         { type: array, items: { type: object, properties: { mount: { type: string }, usedBytes: { type: integer, format: int64 }, totalBytes: { type: integer, format: int64 } } } }
        netRxBytes:    { type: integer, format: int64, description: 自启动累计下行 }
        netTxBytes:    { type: integer, format: int64, description: 自启动累计上行（媒体流量主项） }
        uptimeSeconds: { type: integer, format: int64 }
        version:       { type: string }

    # ---- 旧版迁移（qimeng_backup.json）：字段级权威定义在旧仓库 DATA_MIGRATION_SPEC.md，
    # ---- 段级映射见 DOMAIN_RULES §10；可选字段缺省语义（旧备份可能缺后加字段），导入端不假设全字段存在。
    LegacyBackupImport:
