# Gradle 9.5.0：S3 基座升级批（2026-09-13）落定版本。AGP 9.2 配对下限 Gradle >= 9.4
# （developer.android.com/build/releases/agp-9-2-0-release-notes），9.5.0 满足且为本地
# 已验证可解析的 9.x 线；升级依据与三步走路线见仓库外备忘录 a-s3-agp9-upgrade-memo.md
# （本批 = 第 1+2 步：Gradle 9 + AGP 9.2 + Hilt >= 2.59，compileSdk 仍 36；第 3 步
# compileSdk 37 不在本批）。Gradle 9 是 AGP 9 的硬前提，wrapper 与 AGP 必须同批动，
# 不得单拆升级或单独回退（回退须两者一起回）。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
