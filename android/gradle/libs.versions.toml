okhttp = "5.4.0"
# 与 make sdk 生成物 build.gradle 锁定的 moshi 版本一致（生成物为唯一事实源，勿单方面升级）
moshi = "1.15.2"
junit = "4.13.2"
datastore = "1.2.1"
coroutines = "1.10.2"
# Coil 3（2026-09-06 M4-2 引入，拍板：动图缩略图动画；2026-09-13 S3 第 3 步随 compileSdk 37 +
# Kotlin 2.4.20 解锁升至 3.6.2）。stable 线核查（Maven Central maven-metadata，2026-09-13 实存：
# 3.4.0/3.5.0/3.6.0/3.6.1/3.6.2，3.6.2 = 线末位）：
#   3.6.2 -> minCompileSdk=37（S3 第 3 步 compileSdk 37 已满足）+ Kotlin 2.4 编译（工程已同步
#            升 Kotlin 2.4.20；Hilt 2.60.1 的 kotlin-metadata-jvm 对 2.4 metadata 的兼容经
#            assembleDebug Hilt 聚合根全链实测通过——原 3.5.0 时代的否决因[2.4.0 metadata 超出
#            Hilt 2.58 上限 2.3.0]已随 S3 第 1+2 步 Hilt 2.60.1 解除）
#   3.4.0 -> 原冻结档（minCompileSdk=35 + Kotlin 2.3.10）锁版，已被上述解锁取代。
# 来源：https://repo1.maven.org/maven2/io/coil-kt/coil3/ + https://coil-kt.github.io/coil/。
# 白名单内（ADR-0014 Coil 3），coil-gif 为同家族 GIF 解码模块。
coil = "3.6.2"
# WorkManager（2026-09-06 M4-5 引入，上传串行队列）。官方 release 页核查（2026-09-06，
# https://developer.android.com/jetpack/androidx/releases/work，页面更新 2026-08-11）：
#   stable 线最新 2.11.2（2026-09-18 任务P P5 复核维持：2.12.0-rc01 非 stable 不取；
#   2.11.2 的网络约束修复已被 2.12.0-alpha01 吸收，将来升 2.12 stable 不丢，再评估触发=2.12 stable 化）；
#   minSdk 23+/compileSdk 33+，兼容 minSdk 26/compileSdk 37；2.11.2 修复 2.11.0/2.11.1 的网络约束误判
#   （Android 15+ 断网时 constraint 误通过/后台网络调用失败）——上传队列依赖网络约束，
#   必须落在此修复线。work-testing 为官方同家族测试件（HANDOVER_APP §4.9 允许口径）。
work = "2.11.2"
# Media3（2026-09-07 M4-3 3c 引入，视频播放器 BiliPlayerView 桥接；2026-09-18 任务P P5①
# 升 1.11.1=线内 stable 最新）。锁版依据（Google Maven maven-metadata 实存核查 2026-09-18）：
#   1.8.0 原锁（旧项目桥接兼容验证版+本地缓存件），【待联网复核】标注就此清偿——复核结论：
#   1.8.0 系 2025 年旧 stable 线，其后 1.9.x/1.10.x/1.11.x 三条 stable 线更迭；
#   1.11.0 = stable 头版（官方 release 页 2026-08-05），1.11.1 = 线内末位补丁（maven
#   <release> 2026-09-11，无逐条 changelog=patch 惯例）。升级要点：media3-common 的 Kotlin
#   升 2.2.0（消费端 2.4.20 兼容）、ExoPlayer 动态调度默认启用、MediaSession 线程约束收紧、
#   移除一批废弃符号——BiliPlayerView 宿主=PlayerView（public API 未动）。
#   BiliPlayerView 桥接兼容性=P5① 最高风险点（ADR-0014 AndroidView 互操作例外件），
#   已过全形态视频走查（任务P P5① 冒烟：起播/推进/退出重进，截图 android/.walk/p5/）。
media3 = "1.11.1"
# Room（2026-09-07 M4-4 引入，行为上报离线队列 pending_view_events）。
# 2.8.5（2026-09-18 任务P P5③ 升级，2.x stable 线末位=2026-09-09 补丁：修 DB 关闭后调
#   suspend 查询/invalidation tracker 抛 IllegalStateException b/543076356；maven-metadata
#   实存核查 dl.google.com 2026-09-18。androidx.room3 新包不取）。核查线索：
#   https://developer.android.com/jetpack/androidx/releases/room（2.x 线收尾于 2.8.x）；
#   注意：2.8 线起 room-ktx 已并入 room-runtime（官方迁移说明），勿再单独引 room-ktx；
