#                  1.2 线早于 2026-08 要求 compileSdk 37 的 androidx wave——历史冻结档下锁此线，S3 第 3 步
#                  后仍兼容（minCompileSdk 低）。2026-09-18 任务P P5 复核：维持 1.2.1——1.3 线全 alpha
#                  （maven 最新 1.3.0-alpha11），再评估触发=1.3 stable 化）
