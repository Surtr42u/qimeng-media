# 依赖版本唯一收口（HANDOVER_APP 通用约束 3：版本号必须当场查官方来源并锁版本，锁后本批次内不得升级）。
# 核查日 2026-09-04，来源链接（交付报告同引）：
#   agp            https://developer.android.com/build/releases/gradle-plugin（原 8.13 线最新 8.13.2；
#                  2026-09-13 S3 基座升级批按仓库外 a-s3-agp9-upgrade-memo.md 升至 9.2 线最新 9.2.1，
#                  配对 Gradle 9.5.0，maven-metadata 实存核查 dl.google.com 2026-09-13）
#   kotlin/ksp     https://github.com/JetBrains/kotlin/releases/tag/v2.4.20（2.4 线最新 stable，repo1
#                  maven-metadata 实存核查 2026-09-13：2.4.0/2.4.10/2.4.20；S3 第 3 步随 Coil 3.6.2
#                  解锁升级——Coil 3.5.0 起以 Kotlin 2.4 编译。KGP 2.4.20 含 gradle96 变体（构建于
#                  Gradle 9.5.1），但该变体 org.gradle.plugin.api-version=9.6，本工程 Gradle 9.5.0
#                  按属性匹配仍选 gradle813 变体（同 2.3.21 时代的官方矩阵外回退路径，实测可工作；
#                  彻底对齐需 Gradle ≥9.6，wrapper 升级留后续批））
#                  https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-api/
#                  （KSP 2.3.0 起与 Kotlin 编译器版本解耦，2.3.12 为当前稳定，随本批配套升级）
#   composeBom     https://developer.android.com/develop/ui/compose/bom/bom-mapping（BOM 2026.08.00
#                  -> ui/animation 1.12.0 / material3(BOM 管控) 1.4.0，dl.google.com maven-metadata
#                  实存核查 2026-09-13。compose 1.12 AAR 元数据要求 compileSdk 37 + AGP ≥9.1.1——
#                  S3 第 3 步 compileSdk 37 落地后解锁；2026.09.00 已发布，本批按备忘录第 3 步口径
#                  锚定 37 门禁线首版 2026.08.00，2026.09+ 留后续批评估）
#   navigation     https://developer.android.com/jetpack/androidx/releases/navigation（2.10 线 stable
#                  末位 2.10.1；2.10.0 起要求 compileSdk 37 的门禁已随 S3 第 3 步解除）
#   activity       https://developer.android.com/jetpack/androidx/releases/activity（1.13.0 stable；
#                  1.14 尚在 alpha 不取）
#   lifecycle      https://developer.android.com/jetpack/androidx/releases/lifecycle（2.11.0 stable；
#                  2.12 尚在 alpha 不取）
#   core-ktx       https://developer.android.com/jetpack/androidx/releases/core（stable 1.19.0，随
#                  2026-08 wave 解锁升级）
#   hilt           https://github.com/google/dagger/releases（2026-09-13 S3 批随 AGP 9.2.1 升至
#                  最新稳定 2.60.1——repo1 maven-metadata 实存核查；对 Kotlin 2.4 编译产物的兼容性
#                  经 assembleDebug 全链实测通过）
#   androidx.hilt  https://developer.android.com/jetpack/androidx/releases/hilt（1.4.0 stable；1.4.0
#                  要求 compileSdk 37——S3 第 3 步解锁后升级）
# 注：2026-08 的 androidx 新 wave（compose 1.12/navigation 2.10/lifecycle 2.11/hilt 1.4/activity 1.13）
# 曾统一要求 compileSdk 37（AAR 元数据硬门禁，assembleDebug 实测报错）——该门禁已随 S3 第 3 步
# compileSdk 37 落地解除，上述各族已升入 wave 线。下文历史注释中冻结档（AGP 8.13.2/compileSdk 36/
# Hilt 2.58 metadata 上限 2.3.0）时代的锁版实证记录，凡涉及已升级项均已改写为当前口径，未升级项
# （Vico 2.5.1/DataStore 1.2.1/Work 2.11.2 等）保留历史论证。S3 升级依据与三步走路线见仓库外
# 备忘录 a-s3-agp9-upgrade-memo.md。
#   okhttp         与 make sdk 生成物 build.gradle 锁定的 okhttp 5.4.0 对齐（单版本原则；生成物为唯一事实源）
#   datastore      https://developer.android.com/jetpack/androidx/releases/datastore（stable 1.2.1，2026-03-11；
#                  1.2 线早于 2026-08 要求 compileSdk 37 的 androidx wave——历史冻结档下锁此线，S3 第 3 步
#                  后仍兼容（minCompileSdk 低），1.3 stable 化后另行评估，本批不动）
#   coroutines     1.10.2 = 工程经 lifecycle/compose 传递解析到的 kotlinx-coroutines 版本（assembleDebug 实测）；
#                  test 包与 core 必须同版本（官方 pairing 规则），test-only 用途
#   junit          https://github.com/junit-team/junit4/releases（4.13.2，4.x 最终版）
# 白名单（ADR-0014）：Compose M3 / Hilt / Navigation Compose / Coil 3 / Media3 / Room / DataStore / WorkManager；
# Coil/Media3/Room/DataStore/WorkManager 到对应批次（M4-3/4/5/6）再当场查官方版本锁入，禁止提前占位。

[versions]
agp = "9.2.1"
kotlin = "2.4.20"
ksp = "2.3.12"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.1"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
okhttp = "5.4.0"
# 与 make sdk 生成物 build.gradle 锁定的 moshi 版本一致（生成物为唯一事实源，勿单方面升级）
moshi = "1.15.2"
junit = "4.13.2"
datastore = "1.2.1"
coroutines = "1.10.2"
# Coil 3（2026-09-06 M4-2 引入，拍板：动图缩略图动画；2026-09-13 S3 第 3 步随 compileSdk 37 +
# Kotlin 2.4.20 解锁升至 3.6.2）。stable 线核查（Maven Central maven-metadata，2026-09-13 实存：
# 3.4.0/3.5.0/3.6.0/3.6.1/3.6.2，3.6.2 = 线末位）：
#   3.6.2 -> minCompileSdk=37（S3 第 3 步 compileSdk 37 已满足）+ Kotlin 2.4 编译（工程已同步
#            升 Kotlin 2.4.20；Hilt 2.60.1 的 kotlin-metadata-jvm 对 2.4 metadata 的兼容经
#            assembleDebug Hilt 聚合根全链实测通过——原 3.5.0 时代的否决因[2.4.0 metadata 超出
#            Hilt 2.58 上限 2.3.0]已随 S3 第 1+2 步 Hilt 2.60.1 解除）
#   3.4.0 -> 原冻结档（minCompileSdk=35 + Kotlin 2.3.10）锁版，已被上述解锁取代。
# 来源：https://repo1.maven.org/maven2/io/coil-kt/coil3/ + https://coil-kt.github.io/coil/。
# 白名单内（ADR-0014 Coil 3），coil-gif 为同家族 GIF 解码模块。
coil = "3.6.2"
# WorkManager（2026-09-06 M4-5 引入，上传串行队列）。官方 release 页核查（2026-09-06，
# https://developer.android.com/jetpack/androidx/releases/work，页面更新 2026-08-11）：
#   stable 线最新 2.11.2（2.12.0 尚在 rc01，不取非稳定版）；minSdk 23+/compileSdk 33+，
#   与冻结的 minSdk 26/compileSdk 36 兼容；2.11.2 修复 2.11.0/2.11.1 的网络约束误判
#   （Android 15+ 断网时 constraint 误通过/后台网络调用失败）——上传队列依赖网络约束，
#   必须落在此修复线。work-testing 为官方同家族测试件（HANDOVER_APP §4.9 允许口径）。
work = "2.11.2"
# Media3（2026-09-07 M4-3 3c 引入，视频播放器 BiliPlayerView 桥接）。离线批次锁版来源：
#   ①旧项目 QimengMedia gradle/libs.versions.toml:20（BiliPlayerView 原生宿主版本，桥接兼容性已验证）；
#   ②本地 Gradle 缓存 ~/.gradle/caches/modules-2/files-2.1/androidx.media3/ 已有完整 1.8.0 构件
#     （media3-exoplayer/media3-ui 实测在列，离线可解析）。
#   【待联网复核】下一批次联网时对照官方 release 页
#   （https://developer.android.com/jetpack/androidx/releases/media3）复核 1.8.0 stable 定位后移除本标注。
media3 = "1.8.0"
# Room（2026-09-07 M4-4 引入，行为上报离线队列 pending_view_events）。
# 版本 2.8.4 = 主会话冻结口径（2.x stable 线末位；androidx.room3 新包不取）。核查线索：
#   https://developer.android.com/jetpack/androidx/releases/room（2.x 线收尾于 2.8.x）；
#   本地 Gradle 缓存已有完整 2.8.4 构件（room-runtime/room-compiler 实测在列，离线可解析）。
#   注意：2.8 线起 room-ktx 已并入 room-runtime（官方迁移说明），勿再单独引 room-ktx；
#   Room 2.8.4 room-compiler × Kotlin 2.4.20 / KSP 2.3.12（S3 第 3 步升级后）兼容性以 assembleDebug 实测为准。
room = "2.8.4"
# Vico（2026-09-09 任务H H2 引入，统计页折线图，ADR-0018；白名单外一次性拍板：用户 2026-09-08
# 「不要自绘」「统计页折线图换 Vico」原话）。官方仓库/Maven group = patrykandpatrick/vico
# （https://github.com/patrykandpatrick/vico + https://repo1.maven.org/maven2/com/patrykandpatrick/vico/）。
# 2.5.1（2026-09-09 冻结档锁版：当时否决 3.3.1/2.5.2 的因 = @Metadata 超出 Hilt 2.58 的
#   kotlin-metadata-jvm 上限 2.3.0 + minCompileSdk 门禁）已随 S3 第 1+2+3 步全部解除
#   （Hilt 2.60.1 + compileSdk 37 + Kotlin 2.4.20），升 3.3.1/2.5.2 技术上已可行；
#   但 Vico 不在 S3 第 3 步改动清单内，本批不动，升级留后续批当场核查官方版本再锁。
vico = "2.5.1"
# material3 1.5.0-alpha28（2026-09-13 S3 第 3 步升级，1.5.0-alpha 线内末位；任务V V6 于 2026-09-11
# 曾锁 alpha15，其「解锁条件 = AGP 9 + SDK 37 整体路线开启后升回线内最新」现满足）：Google Maven
#   官方索引锁版 https://dl.google.com/android/maven2/androidx/compose/material3/material3/
#   maven-metadata.xml（2026-09-13 实查：1.5.0 线末位=1.5.0-alpha28，1.5.0 stable 未发布）。
# 历史（V6 批，冻结档）：alpha15 为当时已隔离实证三关+收益全过的最低可行点（minCompileSdk=35
#   兼容 36；收益=MotionScheme/MaterialExpressiveTheme/LoadingIndicator 自 1.4.0 全 internal 转
#   public）；不追线内最新的因 = alpha28 起 AAR metadata 硬性要求 compileSdk 37 + AGP 9.1.0
#   （assembleDebug checkDebugAarMetadata 20 条冲突，证据 %TEMP%\qimeng-v6-evidence\）。
# 现口径：AGP 9.2.1 + compileSdk 37（S3 第 3 步）满足 alpha28 门禁，升回线内末位；仍需显式
#   version.ref——BOM 2026.08.00 管控的 material3 仍是 1.4.0，不覆盖 1.5.0-alpha 线，其余 BOM
#   管控构件（ui/foundation/animation 等）随 BOM 不动。
material3 = "1.5.0-alpha28"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# 共享元素转场（exp#3 试点）：SharedTransitionLayout/sharedBounds 在 animation 构件，
# 版本随 BOM（2026.08.00 → animation 1.12.0，compose ui·animation 同步发布），禁止单独升级
compose-animation = { group = "androidx.compose.animation", name = "animation" }
# rememberSaveable 所在构件（QimengValuePillBlock 两行钳制展开态）：foundation 传递可见但本仓
# 显式依赖纪律下 core:ui 直用须自声明，版本随 BOM，禁止单独升级
compose-runtime-saveable = { group = "androidx.compose.runtime", name = "runtime-saveable" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-adapters = { group = "com.squareup.moshi", name = "moshi-adapters", version.ref = "moshi" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coil-core = { group = "io.coil-kt.coil3", name = "coil-core", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
# Media3（M4-3 3c，白名单 ADR-0014）：ExoPlayer 内核 + PlayerView（BiliPlayerView 宿主），版本注释见 [versions]
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Room（M4-4 行为上报离线队列，白名单 ADR-0014）：runtime 含挂起 DAO/事务支持（2.8 起 ktx 并入），
# compiler 为 KSP 注解处理器；版本论证见 [versions] room 注释。
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# lifecycle-process（M4-4 回前台补传触发：ProcessLifecycleOwner ON_START），与 lifecycle 同版本收口
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
# Vico 图表（任务H H2，ADR-0018）：compose-m3 已传递依赖 compose + core，只引这一个坐标即可
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# build-logic convention 插件的编译期依赖（compileOnly；版本锚定同上方 agp/kotlin，禁止单独升级）。
# 运行期版本由主工程根 build.gradle.kts 的 apply false 收口，convention 不携带运行时版本。
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Kotlin 2.x 起 Compose 编译器随 Kotlin 发布，插件版本必须与 kotlin 一致
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# 本工程 build-logic 的 convention 插件（NIA 范式）：version unspecified = 由 android/build-logic
# included build 提供；真实插件（AGP/Kotlin/KSP/Hilt）版本仍由上方别名经根 build.gradle.kts 收口。
qimeng-android-application = { id = "qimeng.android.application", version = "unspecified" }
qimeng-android-library = { id = "qimeng.android.library", version = "unspecified" }
qimeng-android-compose = { id = "qimeng.android.compose", version = "unspecified" }
qimeng-android-hilt = { id = "qimeng.android.hilt", version = "unspecified" }
qimeng-jvm-library = { id = "qimeng.jvm.library", version = "unspecified" }
