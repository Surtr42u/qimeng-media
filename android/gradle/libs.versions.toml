# build-logic convention 插件的编译期依赖（compileOnly；版本锚定同上方 agp/kotlin，禁止单独升级）。
# 运行期版本由主工程根 build.gradle.kts 的 apply false 收口，convention 不携带运行时版本。
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Kotlin 2.x 起 Compose 编译器随 Kotlin 发布，插件版本必须与 kotlin 一致
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# 本工程 build-logic 的 convention 插件（NIA 范式）：version unspecified = 由 android/build-logic
# included build 提供；真实插件（AGP/Kotlin/KSP/Hilt）版本仍由上方别名经根 build.gradle.kts 收口。
qimeng-android-application = { id = "qimeng.android.application", version = "unspecified" }
qimeng-android-library = { id = "qimeng.android.library", version = "unspecified" }
qimeng-android-compose = { id = "qimeng.android.compose", version = "unspecified" }
qimeng-android-hilt = { id = "qimeng.android.hilt", version = "unspecified" }
qimeng-jvm-library = { id = "qimeng.jvm.library", version = "unspecified" }
