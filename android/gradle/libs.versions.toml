# （https://github.com/patrykandpatrick/vico + https://repo1.maven.org/maven2/com/patrykandpatrick/vico/）。
# 2.5.2（2026-09-18 任务P P5② 升级，2.x 线末位补丁：修 AreaFill 填充 bug #1517，无 API 变化；
#   当时否决 3.3.1/2.5.2 的因 = @Metadata 超出 Hilt 2.58 的 kotlin-metadata-jvm 上限 2.3.0 +
#   minCompileSdk 门禁）已随 S3 第 1+2+3 步全部解除（Hilt 2.60.1 + compileSdk 37 + Kotlin 2.4.20）。
#   3.3.1 = major 跳线记档顺延（官方宣布 vico 2 修复期止于 2026-07-31 已 EOL）：3.0.0 移除废弃
#   API/3.2.0 LineProvider.getLine 加 seriesKey 参数（Kotlin 函数式接口不兼容改签名）须
#   QimengTrendLineChart 等 feature:stats 四文件用点全核对 + ADR-0018 补记，超轻量批口径；
#   3.3.1 修 LineCartesianLayer 在 Android 10 的 ART JIT 崩溃 b/553511933——再评估触发条件 =
#   Android 10 真机图表崩溃报障，或下次涉 ADR-0018 的图表批次。
vico = "2.5.2"
# material3 1.5.0-alpha28（2026-09-13 S3 第 3 步升级，1.5.0-alpha 线内末位；任务V V6 于 2026-09-11
# 曾锁 alpha15，其「解锁条件 = AGP 9 + SDK 37 整体路线开启后升回线内最新」现满足）：Google Maven
#   官方索引锁版 https://dl.google.com/android/maven2/androidx/compose/material3/material3/
#   maven-metadata.xml（2026-09-13 实查：1.5.0 线末位=1.5.0-alpha28，1.5.0 stable 未发布）。
# 历史（V6 批，冻结档）：alpha15 为当时已隔离实证三关+收益全过的最低可行点（minCompileSdk=35
#   兼容 36；收益=MotionScheme/MaterialExpressiveTheme/LoadingIndicator 自 1.4.0 全 internal 转
#   public）；不追线内最新的因 = alpha28 起 AAR metadata 硬性要求 compileSdk 37 + AGP 9.1.0
#   （assembleDebug checkDebugAarMetadata 20 条冲突，证据 %TEMP%\qimeng-v6-evidence\）。
# 现口径：AGP 9.2.1 + compileSdk 37（S3 第 3 步）满足 alpha28 门禁，升回线内末位；仍需显式
#   version.ref——BOM 2026.08.00 管控的 material3 仍是 1.4.0，不覆盖 1.5.0-alpha 线，其余 BOM
#   管控构件（ui/foundation/animation 等）随 BOM 不动。
material3 = "1.5.0-alpha28"
# Backdrop（2026-10-03 悬浮玻璃坞底栏引入，ADR-0033 依赖决策）：液态玻璃 backdrop 采样库，
#   官方文档 https://kyant.gitbook.io/backdrop/（源仓库 Kyant0/AndroidLiquidGlass）。锁版依据：
#   Maven Central maven-metadata 实查（2026-10-03，https://repo1.maven.org/maven2/io/github/kyant0/backdrop/）：
#   2.0.1 = 2.x stable 线末位（<lastUpdated>2026-08-26）。仅 :core:ui 消费（玻璃坞渲染单源），
#   传递依赖 io.github.kyant0:shapes 自动带入。许可证 Apache-2.0。
backdrop = "2.0.1"

