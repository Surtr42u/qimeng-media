# Gradle 守护进程：多模块 + Compose 编译 + lint 峰值内存按 4G 预留，过小易 OOM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 强制（Compose/Androidx 全家桶前提）
android.useAndroidX=true
# R 类只含本模块资源，加速增量构建（Now in Android 同款）
android.nonTransitiveRClass=true

kotlin.code.style=official

# S3 基座升级批（AGP 9 过桥，2026-09-13）：AGP 9 默认启用内置 Kotlin + 新 DSL
# （developer.android.com/build/migrate-to-built-in-kotlin / AGP 9.0 release notes），
# 本工程继续走 KGP（org.jetbrains.kotlin.android，Kotlin 2.3.21 满足官方下限 2.2.20），
# 用官方临时旁路关闭内置 Kotlin 与新 DSL——两个 flag 均为官方注明的临时开关（未来版本移除），
# 届时按备忘录 a-s3-agp9-upgrade-memo.md 第 4 步迁移 built-in Kotlin 后撤除。
android.builtInKotlin=false
android.newDsl=false
