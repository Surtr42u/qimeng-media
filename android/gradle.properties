# Gradle 守护进程：多模块 + Compose 编译 + lint 峰值内存按 4G 预留，过小易 OOM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 强制（Compose/Androidx 全家桶前提）
android.useAndroidX=true
# R 类只含本模块资源，加速增量构建（Now in Android 同款）
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 内置 Kotlin + 新 DSL（任务P P3 迁移，2026-09-18 落地）：两官方旁路 flag
# （android.builtInKotlin/android.newDsl，S3 时代过桥用）已全部撤除——AGP 10 起不再可用，
# 与其到期前主动迁移（developer.android.com/build/migrate-to-built-in-kotlin）。
# 迁移后 Android 模块不再 apply org.jetbrains.kotlin.android（jvmTarget 随
# compileOptions.targetCompatibility）；纯 JVM 模块（:sdk/:core:model）保留 KGP
# kotlin("jvm")（官方语义=内置 Kotlin 仅取代 kotlin-android 插件，混用为支持形态）。
