// Compose 编译器稳定性配置（2026-10-04 批；Now in Android compose_compiler_config.conf 同款机制，
// 官方口径 https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file）。
//
// 为什么需要：core:model 值对象全部全 val 构造，但 String/枚举之外含 List 字段——List 是
// 接口（可能被实现为可变），编译器保守判 unstable；UiState.copy() 每次出新实例时，持有这些
// 模型的组合子树被判「参数可能已变」而全量重组。本文件把逐类核验过的不可变值类标记 stable，
// 让 equals 相同的实例间可跳过重组。
//
// 收录纪律（宁可少列不可错列，逐类核验后才可上榜）：
// 1. 构造参数全 val；
// 2. 字段类型仅 primitive/String/本包枚举/嵌套已核验 data class/List；
// 3. 全仓无原地改写这些实例字段的代码（改动只走 data class copy 出新实例）。
//
// 明确不收录（核验不过，禁止顺手加回）：
// - AlbumFilterState：authors/characters 字段是 Set（不在白名单类型内）；
// - FourDimPillModel：字段引用 AlbumFilterState（传递性不纯）；
// - PillSpec：payload 是 Any?（开放类型，编译器无从判稳）；
// - AssetQuery/FacetsQuery/HistoryQuery：dateFrom/dateTo 是 java.time.LocalDate（非稳定已知类型；
//   请求对象也不进组合树，无需收录）；
// - FilterPanelUiState：message 字段是 sealed interface PanelFeedback（非 data class）。
// - 各枚举不列：Compose 编译器对枚举原生判 stable，无需配置。
// - 整包通配不启用：包内存在上述不纯类，`.*` 会把它们一并误标。

