<!doctype html>
<!-- lang 用 zh-CN：产品面向中文用户，界面文案全部为简体中文 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover：PWA 全屏场景下内容铺满刘海/圆角区域，配合 CSS env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="绮梦影库：媒体全存 NAS 的 Web 客户端，多设备随时随地浏览你的媒体库" />
    <!-- PWA meta：iOS 添加到主屏幕后按独立应用启动（无地址栏，黑色半透明状态栏贴合沉浸设计） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="绮梦影库" />
    <!-- 初始暗色（ADR-0031 暗色优先）；亮色值由下方内联脚本按"手动选择 > 暗色默认"切换（浏览器对 theme-color 只取单值，无法写 CSS 变量） -->
    <meta name="theme-color" content="#0b0c16" />
    <title>绮梦影库</title>
    <script>
      // 首帧防闪白 + theme-color 同步：在应用 JS 加载前设置 html.dark。
      // 语义与 src/lib/theme.ts 一致（THEME_STORAGE_KEY='qimeng_theme' 双写，改动须两处同步）：
      // 手动选择（localStorage）优先；无手动选择时默认暗色（ADR-0031 暗色优先，不再跟随系统）。
      // 色值 = tokens.css 画布 --qm-bg 的 hex 形态：dark #0b0c16 / light #f3f3f9（theme.ts 双写）。
      ;(function () {
        var KEY = 'qimeng_theme'
        function apply(dark) {
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b0c16' : '#f3f3f9')
        }
        function stored() {
          var v = localStorage.getItem(KEY)
          return v === 'light' || v === 'dark' ? v : null
        }
        var s = stored()
        apply(s !== null ? s === 'dark' : true)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
