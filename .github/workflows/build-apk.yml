name: 云端出包（内嵌 arm64 release 包）

# 手动 release 出包；与常规 CI 共用 make sdk 的校验/生成/指纹纪律。
# Go 补丁版本与 CI、lint 保持一致。签名 Secret 缺失时无法保证覆盖安装。
# 单测必须成功后才能上传候选包；正式交付仍核对同 SHA 的完整 CI/安全/文档与审查。
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  apk:
    name: 内嵌 arm64 release 包（assembleRelease + 单测）
    runs-on: ubuntu-latest
    # 全链最重：三端生成 + Go 交叉编译 + ffmpeg 下载装配 + gradle assemble/单测
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24 }
      # JDK 21 与 ci.yml android 作业同档（AGP 9.3.1 最低 17）
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: 21 }
      # 签名 keystore 还原（第五百一十九笔）：必须在任何 Gradle 任务之前——AGP 在
      # release 构建解析 signingConfigs 时就会读 ~/.android/debug.keystore，晚于
      # 构建步骤还原则本次包的签名已随 runner 随机生成，覆盖安装依旧失败。
      # Secret 缺失（未配置/新 fork）时整步跳过：回落到「AGP 自行生成」的旧行为，
      # 出包不因此中断（代价=该次包签名与真机不一致，仅能卸载后安装）。
      - name: 还原本机 debug keystore（云端包与真机同签名，可直接覆盖安装）
        env:
          QIMENG_DEBUG_KEYSTORE_B64: ${{ secrets.QIMENG_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "${QIMENG_DEBUG_KEYSTORE_B64}" ]; then
            echo "::warning::未配置 QIMENG_DEBUG_KEYSTORE_B64，本次包将由 runner 随机生成 debug keystore 签名，无法覆盖安装到真机"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "${QIMENG_DEBUG_KEYSTORE_B64}" | tr -d '\r\n' | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # 自检 + 留痕：指纹对得上真机已装包，才能直接 adb install -r
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -E "SHA256:|Alias name"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: sudo apt-get update && sudo apt-get install -y make
      - name: 校验并生成三端 SDK 与指纹
        run: |
          make sdk
          git diff --exit-code -- api/sdk.lock
      # 内嵌形态装配链（= make server-android-arm64 + app-embedded-arm64 装配步）
      - name: 交叉编译内嵌服务端 arm64
        run: |
          cd server
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o ../build/android/arm64-v8a/qimeng-server ./cmd/qimeng
      - name: 装配 jniLibs arm64 三件套（ffmpeg 锁 commit + SHA-256）
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/android/arm64-v8a/qimeng-server android/app/src/main/jniLibs/arm64-v8a/libqimeng.so
          bash deploy/embedded/fetch-ffmpeg-arm64.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: 构建 release 包
        run: |
          cd android
          ./gradlew assembleRelease
      # 产物完整性门禁（口径同 ci.yml android 作业）：内嵌三件套必须随包
      - name: 断言内嵌三件套随包
        run: bash deploy/embedded/assert-apk-embedded.sh android/app/build/outputs/apk/release/app-release.apk
      # 不再接受单测失败的安装包；原始失败证据仍由 Actions 日志保留。
      - name: 单测与 Release Lint（阻断候选包资格）
        run: |
          cd android
          ./gradlew testDebugUnitTest :core:model:test lintRelease
      - name: 上传候选包（本通道检查通过，仍须同 SHA 完整门禁）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-apk-embedded
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
