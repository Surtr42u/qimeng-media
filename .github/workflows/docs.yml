name: 文档与同步责任
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  audit-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - run: python -m unittest discover -s tools -p 'test_audit_library.py'
      - run: python -m unittest discover -s tools -p 'test_check_privacy.py'
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: 历史 migration 只加不改不删
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_migrations.py --base "$MIGRATIONS_BASE"
      - name: 文档链接、索引与改动影响
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python tools/check_docs.py --base "$DOCS_BASE" --event-path "$GITHUB_EVENT_PATH"
          else
            python tools/check_docs.py
          fi
