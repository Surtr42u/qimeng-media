name: 云端协议与查询生成
on:
  push:
    branches: ["codex/codegen/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: 17 }
      - name: 从 SQL 重建 sqlc 类型
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: 三端 SDK 与摘要锁
        run: make sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-sources
          retention-days: 7
          path: |
            api/sdk.lock
            server/internal/store/db/*.sql.go
            server/internal/store/db/models.go
            server/internal/httpapi/gen/
            web/src/api/generated/
            android/sdk/
