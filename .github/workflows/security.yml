name: 依赖安全
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  go-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: 重建未入库的 Go 接口层
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          "$(go env GOPATH)/bin/oapi-codegen" -config internal/httpapi/gen/oapi-codegen.yaml ../api/openapi.yaml
      # 开发工具版本固定，不进入运行时产物；常规文本模式保留有漏洞时的非零退出码。
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  npm-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: { directory: [web, desktop] }
    defaults: { run: { working-directory: '${{ matrix.directory }}' } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
  cargo-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: '1.90.0' }
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file desktop/src-tauri/Cargo.lock
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
