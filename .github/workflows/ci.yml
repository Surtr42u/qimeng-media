# CI：每个 PR / push 到 master 必须全绿才允许合并（ARCHITECTURE §10）
# 五道门禁：协议校验（宪法不容破坏）→ 服务端 → Web → Android 客户端；外加 make sdk 生成链可跑通
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  openapi:
    name: 协议宪法校验（redocly）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: redocly lint（error 失败，warning 不阻塞）
        run: npx -y @redocly/cli lint api/openapi.yaml

  server:
    name: 服务端（Go vet + test + build）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v5
      # 端到端测试需要真实 ffmpeg 生成视频缩略图（生产镜像同样内置 ffmpeg）
      - name: 安装 ffmpeg（缩略图端到端测试依赖）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.x", cache-dependency-path: server/go.sum }
      # 协议生成物不入库（.gitignore），编译前先重建 Go 接口层；
      # oapi-codegen 版本与 Makefile 的 OAPI_CODEGEN_VERSION 保持一致
      - name: 生成 Go 接口层（oapi-codegen）
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          "$(go env GOPATH)/bin/oapi-codegen" -config internal/httpapi/gen/oapi-codegen.yaml ../api/openapi.yaml
      # 模块边界强制（server/.golangci.yml depguard：gen 只许 httpapi 用、业务包禁止反向依赖 httpapi）
      # 版本与本机一致（见 Makefile 顶部 GOLANGCI_LINT 注释）
      - name: golangci-lint（静态检查 + 模块边界）
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: server
      - run: go vet ./...
      # gofmt 门禁：格式不一致即失败（golangci-lint 默认不含 gofmt 检查）
      - name: gofmt 格式校验
        run: test -z "$(gofmt -l .)"
      - run: go test ./... -race -count=1
      - run: go build ./...

  web:
    name: Web（tsc + build）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
      # generated/ 不入库（.gitignore），类型检查前必须先从 openapi.yaml 重建——
      # 否则 SDK 缺失被 TS 解析为 {}，连锁出百余个假类型错误（2026-08-30 CI 实测）
      - run: npx openapi-ts -f src/api/openapi-ts.config.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  sdk-chain:
    name: SDK 生成链（make sdk 三端可重建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.x", cache-dependency-path: server/go.sum }
      # Kotlin 生成需要 JDK；runner 自带 Temurin 17 即可，无需免安装 JDK（那是 Windows 本机方案）
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get update && sudo apt-get install -y make
      - run: make sdk
      # #10 生成物摘要锁校验：make sdk 已随生成重算 api/sdk.lock，这里与
      # 已提交的锁文件 diff——生成器版本漂移、或协议改动未同 commit 更新
      # 锁文件（铁律 1 同步责任）都在此拦截。
      - name: 校验生成物摘要锁（api/sdk.lock 与重算结果 diff）
        run: |
          make sdk-lock
          if ! git diff --exit-code -- api/sdk.lock; then
            echo "::error::api/sdk.lock 与三端生成物重算结果不一致。请在本地运行 make sdk 重新生成后，将更新后的 api/sdk.lock 与本次协议/生成器改动同 commit 提交（指纹入库≠产物入库，见 ADR-0009）。"
            exit 1
          fi
      # R14（2026-09-20 审计清偿）：android/sdk 生成一次、artifact 下发复用，
      # 消除 android job 二次 make sdk 的全链双跑冗余；锁校验通过才上传。
      - name: 上传 android/sdk 生成物（android job 复用）
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk
          path: android/sdk

  android:
    name: Android 客户端（assembleDebug + test + lint）
    needs: sdk-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # android/sdk 消费 sdk-chain job 的 make sdk 产物（artifact 下发）——
      # 生成链已在该 job 校验过 sdk.lock，本 job 不再二次生成（R14 去双跑）。
      - uses: actions/download-artifact@v4
        with: { name: android-sdk, path: android/sdk }
      # JDK 21 与本机 Android Studio jbr 对齐（AGP 9.3.1 最低 17）；ubuntu runner 预装 Android SDK，
      # platforms/build-tools 覆盖 compileSdk 37 所需，无需 sdkmanager（runner 镜像 Readme 为准）
      # （2026-09-20 全库审查：注释自 2026-09-13 后未随任务P 批升级刷新，按 libs.versions.toml
      #  agp=9.3.1 与 build-logic ANDROID_COMPILE_SDK=37 勘正；升级若致 runner 缺 platform 再补 sdkmanager）
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # wrapper 校验 + gradle-user-home 缓存；只调 ./gradlew，不碰 runner 预装 gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 + 单测 + Lint
        run: |
          cd android
          # :core:model 是纯 JVM 模块（kotlin("jvm")）只有 test 任务，testDebugUnitTest 覆盖不到——
          # 与本机 Makefile app-test 的补账对齐（0ff017a）
          ./gradlew assembleDebug testDebugUnitTest :core:model:test lintDebug
