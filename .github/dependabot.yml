# 每周提出升级候选；每个生态最多 1 个常规 PR，安全更新使用独立额度。
# 合并须人工审阅并通过当前 head 的完整门禁，不启用自动合并。
version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    commit-message: { prefix: 'chore(server)' }
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    commit-message: { prefix: 'chore(server)' }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    commit-message: { prefix: 'chore(web)' }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    commit-message: { prefix: 'chore(desktop)' }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    commit-message: { prefix: 'chore(desktop)' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    commit-message: { prefix: 'chore(server)' }
