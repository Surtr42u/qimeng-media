[package]
name = "qimeng-media-desktop"
version = "0.1.0"
description = "绮梦影库桌面壳（连接模式：UI 由 Go 服务端托管）"
edition = "2021"

# 构建顺序约束：必须先在 desktop/ 下 `npm run icon` 生成 src-tauri/icons/ 全套，
# 否则 tauri::generate_context!（编译期嵌入 bundle.icon 声明的图标）会因缺文件编译失败。
# tauri 与 CLI 保持 v2 稳定系列，实际解析版本由 Cargo.lock 锁定。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
# serde/serde_json：server.json 配置读写（不引其它依赖，壳从简）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GTK3 仍要求 glib 0.18；只回移植上游 #1343 的两行安全修复。
# 来源、校验与退役条件见 ../vendor/README.md；禁止用告警忽略替代补丁。
[patch.crates-io]
glib = { path = "../vendor/glib" }
